name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching package.json'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release artifact
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          test -f "docs/releases/${TAG}.md"
          npm run check
          npm test
          python skills/delegrix/scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py'
          npm pack --dry-run
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing replacement"
            exit 1
          fi
          # A pre-existing tag can make gh ignore --target. Require a fresh tag.
          existing_tag=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$existing_tag" ]; then
            echo "Tag already exists; refusing to publish an unverified target"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Delegrix $TAG — Goal-Driven Agent Orchestration" --notes-file "docs/releases/${TAG}.md"
