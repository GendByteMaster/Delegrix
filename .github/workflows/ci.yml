name: Delegrix CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill and scenario validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill structure
        run: python skills/delegrix/scripts/validate.py
      - name: Test preflight plans and interoperability scenarios
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python scripts
        run: python -m compileall -q skills/delegrix/scripts tests

  cli:
    name: CLI installation and packaging (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check CLI syntax
        run: npm run check
      - name: Run CLI lifecycle tests
        run: npm test
      - name: Validate npm package
        run: npm pack --dry-run
